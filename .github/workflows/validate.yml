
name: Validate Tone Matcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check website
        run: |
          test -f index.html
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          grep -q 'toneSearch' index.html
          grep -q 'const tones' index.html
          python3 - <<'PY'
          import re, subprocess
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script\\b[^>]*>(.*?)</script>', html, re.I | re.S)
          for i, script in enumerate(scripts):
              if script.strip():
                  path = '/tmp/tone-matcher-inline-' + str(i) + '.js'
                  open(path, 'w', encoding='utf-8').write(script)
                  print('Checking inline script', i, 'length', len(script))
                  subprocess.run(['node', '--check', path], check=True)
          PY
          echo "Tone Matcher validation passed."
